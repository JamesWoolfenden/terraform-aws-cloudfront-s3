suppressions:
  - policy_id: HLD_AWS_144
    resource_id: aws_s3_bucket.logging
    reason: "This is the module's terminal access-logging bucket; it does not log its own access to avoid a self-referential/circular logging loop and unnecessary storage cost. No second dedicated bucket exists to receive its logs."
    approved_by: james.woolfenden@gmail.com

  - policy_id: HLD_AWS_305
    resource_id: aws_cloudfront_distribution.website
    reason: "Single-origin architecture is intentional; origin failover is left to the consumer to add if their use case needs it (matches the pre-existing checkov:skip=CKV_AWS_310 comment on this resource)."
    approved_by: james.woolfenden@gmail.com
